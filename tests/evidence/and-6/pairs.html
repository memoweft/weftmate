<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AND-6 原网页与原生对比</title><style>body{font:16px system-ui;max-width:1500px;margin:32px auto;padding:0 20px}img{width:100%;height:auto}figure{margin:40px 0}p{line-height:1.65}.labels{display:flex;justify-content:space-around;font-weight:bold}</style><h1>原网页（左）与原生（右）</h1><p>同一合成账号、相同数据、相同逻辑宽度和页面主题。原图为 MuMu 整屏 720×1280，未重绘系统栏。深色左侧保留真实旧网页配色，右侧按本人指定中性灰规范。</p>
<figure><h2>light · content</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-content.png" alt="light content 并排图"><figcaption><p>一致：三个区块、任务内容、来源对话与状态相同。</p><p>故意更好：原生整行打开详情，提供一排直接点选；深色按中性灰规范。</p><p>还差：等电脑上线的事项保留「完整目标功能」原网页入口。</p></figcaption></figure>
<figure><h2>light · empty</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-empty.png" alt="light empty 并排图"><figcaption><p>一致：保留各区块的图标、说明和下一步入口。</p><p>故意更好：骨架与错误重试在原生页完成，手机单独使用不会报故障。</p><p>还差：无电脑的真机登录链路由手机独立包验收，本包验证已有手机身份进入。</p></figcaption></figure>
<figure><h2>light · row-menu</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-row-menu.png" alt="light row-menu 并排图"><figcaption><p>一致：编辑、立即运行、来源对话与红色删除均在行菜单。</p><p>故意更好：增加原生执行记录入口；删除需要二次确认。</p><p>还差：复杂来源对话操作仍有原网页入口。</p></figcaption></figure>
<figure><h2>light · new-form</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-new-form.png" alt="light new-form 并排图"><figcaption><p>一致：做什么、所属对话、到点做什么、重复与时间规则相同。</p><p>故意更好：原生保存按钮固定，表单滚动和键盘内缩沿应用安全区。</p><p>还差：长期目标编辑与检查点调整沿来源对话；现有契约没有独立编辑接口。</p></figcaption></figure>
<figure><h2>light · feed-filters</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-feed-filters.png" alt="light feed-filters 并排图"><figcaption><p>一致：全部／待处理／任务／提醒／记忆都是一排直接点选。</p><p>故意更好：超过可见宽度时横向滑动，当前项有圆角底与读屏选中态。</p><p>还差：真机字体放大与手势条需本人确认；原复杂动作入口继续保留。</p></figcaption></figure>
<figure><h2>light · library-filters</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-library-filters.png" alt="light library-filters 并排图"><figcaption><p>一致：全部／文档／表格／图片／代码／其它回到同一排；项目、时间仍是下拉。</p><p>故意更好：三页共用同一个筛选组件，溢出横向滑动。</p><p>还差：文件查看能力沿已合并成果库包，本包只改筛选。</p></figcaption></figure>
