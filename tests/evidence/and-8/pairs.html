<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AND-8 原网页与原生对比</title><style>body{font:16px system-ui;max-width:1500px;margin:32px auto;padding:0 20px}img{width:100%;height:auto}figure{margin:40px 0}p{line-height:1.65}.labels{display:flex;justify-content:space-around;font-weight:bold}</style><h1>原网页（左）与原生（右）</h1><p>同一合成账号、同样健康数据、同一日期和主题；实际 HybridActivity 与 NativeActivity 整屏。深色左侧保留实际网页绿色，右侧按本人指定中性灰磨砂。仅改变隔离包逻辑宽度，没有修改模拟器设置。</p>
<figure><h2>light · content</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-content.png" alt="light content 并排图"><figcaption><p>一致：今日解读、六项分数、日期和来源数字相同。</p><p>故意更好：图表与页面原生绘制；深色按指定中性灰磨砂。</p><p>还差：真实手机健康来源接入、底部系统手势区仍需真机确认。</p></figcaption></figure>
<figure><h2>light · empty</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-empty.png" alt="light empty 并排图"><figcaption><p>一致：同一接入说明、iPhone 接入步骤与三张明确标为示意的卡片。</p><p>故意更好：手机没有电脑或健康来源时也正常显示，不报故障。</p><p>还差：真实健康来源接入属于采集工作包；本页功能没有遗漏。</p></figcaption></figure>
<figure><h2>light · calendar-open</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-calendar-open.png" alt="light calendar-open 并排图"><figcaption><p>一致：前后月、自然日、运动标记、禁用未来日期及选中日相同。</p><p>故意更好：原生44点按区，选日期后读取当日并关闭月历。</p><p>还差：底部系统手势区与字体放大留本人真机确认。</p></figcaption></figure>
<figure><h2>light · sleep-detail</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-sleep-detail.png" alt="light sleep-detail 并排图"><figcaption><p>一致：睡眠分数、实际与目标睡眠条、对比和分期来自同一回执。</p><p>故意更好：时长写“7 小时 46 分”，不写“466 分钟”；原生页面与图表。</p><p>还差：可选“原网页详情”仍打开准确日期／指标；本页现有详情均已原生。</p></figcaption></figure>
<figure><h2>light · trend-overlay</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-trend-overlay.png" alt="light trend-overlay 并排图"><figcaption><p>一致：同一天、睡眠时长、14天、缺测断线、平时范围带、平均与深夜使用柱相同。</p><p>故意更好：时长统一按小时／分表达，点图与读屏可查看每日值，筛选直接一排点。</p><p>还差：横向筛选和图表点选手势需本人真机确认；原网页详情入口保留。</p></figcaption></figure>
<figure><h2>light · analysis-open</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-analysis-open.png" alt="light analysis-open 并排图"><figcaption><p>一致：相同按需开关、分析正文、依据和接着问它入口。</p><p>故意更好：分析缓存重复展开不再生成，引用只进入主对话草稿、不自动发送。</p><p>还差：模型实际生成与真机来源数据由既有健康功能验收；本包使用合成统计回执。</p></figcaption></figure>
