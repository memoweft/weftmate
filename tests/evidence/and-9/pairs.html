<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AND-9 原网页与原生对比</title><style>body{font:16px system-ui;max-width:1500px;margin:32px auto;padding:0 20px}img{width:100%;height:auto}figure{margin:40px 0}p{line-height:1.65}.labels{display:flex;justify-content:space-around;font-weight:bold}</style><h1>原网页（左）与原生（右）</h1><p>同一合成账号、相同数据、相同逻辑宽度和页面主题。原图为 MuMu 整屏 720×1280，未重绘系统栏。深色左侧保留真实旧网页配色，右侧按本人指定中性灰规范。</p>
<figure><h2>light · settings-home</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-settings-home.png" alt="light settings-home 并排图"><figcaption><p>一致：同一分类注册表、同一合成账户与当前主题。</p><p>故意更好：原生分组触控和返回位置；深色按指定中性灰。</p><p>还差：其他分类保留准确原页入口，未宣称所有设置已迁完。</p></figcaption></figure>
<figure><h2>light · general</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-general.png" alt="light general 并排图"><figcaption><p>一致：系统状态、通知、同步、连接与更新入口齐全。</p><p>故意更好：首页与常规列表原生显示，避免误入关于。</p><p>还差：运行记录、更新和备用界面沿原功能入口。</p></figcaption></figure>
<figure><h2>light · services</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-services.png" alt="light services 并排图"><figcaption><p>一致：服务名字、地址、型号数量与查询结果相同。</p><p>故意更好：原生卡片推入编辑页，键值与库继续复用。</p><p>还差：账户云模型留在顶栏更多，手机服务也有独立入口。</p></figcaption></figure>
<figure><h2>light · services-empty</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-services-empty.png" alt="light services-empty 并排图"><figcaption><p>一致：同样没有服务；保留添加与下一步说明。</p><p>故意更好：原生空状态和重试，不显示技术错误代码。</p><p>还差：本组无缺少的操作。</p></figcaption></figure>
<figure><h2>light · model-menu-selected</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-model-menu-selected.png" alt="light model-menu-selected 并排图"><figcaption><p>一致：相同已选型号、目录、当前勾选与全部模型搜索。</p><p>故意更好：菜单在同一窗口，草稿与焦点保持；深色改为中性灰磨砂。</p><p>还差：模拟器输入法零高度，真实键盘和手势区留真机确认。</p></figcaption></figure>
<figure><h2>light · add-service</h2><div class="labels"><span>原网页</span><span>原生</span></div><img src="pairs/light-add-service.png" alt="light add-service 并排图"><figcaption><p>一致：相同预设、服务名、地址、接口、密钥与查询流程。</p><p>故意更好：原生表单支持自动默认、显示型号、手填与删除确认。</p><p>还差：密钥与无目录提示分别提供；本组功能入口齐全。</p></figcaption></figure>
