# Include at nginx.conf top level (outside http); replace example.com privately.
stream {
    map $ssl_preread_server_name $weftmate_upstream {
        relay.example.com 127.0.0.1:17001;
        ~*\.hosts\.example\.com$ 127.0.0.1:17444;
        default 127.0.0.1:9443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $weftmate_upstream;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
    # Strip the front listener's PROXY header before the mandatory cloud ingress.
    # No TLS termination, no outgoing PROXY header, no direct route to frps.
    server {
        listen 127.0.0.1:17001 proxy_protocol;
        proxy_protocol off;
        proxy_pass 127.0.0.1:7001;
        proxy_timeout 1h;
    }
    server {
        listen 127.0.0.1:17444 proxy_protocol;
        proxy_protocol off;
        proxy_pass 127.0.0.1:7444;
        proxy_timeout 1h;
    }
}
