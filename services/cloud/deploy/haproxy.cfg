# Review draft: only HAProxy binds public TCP 443. No TLS termination here.
global
    maxconn 4096
defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h
frontend tls_ingress
    bind :443
    tcp-request inspect-delay 5s
    acl client_hello req.ssl_hello_type 1
    acl api_sni req.ssl_sni -i api.example.com
    acl relay_sni req.ssl_sni -i relay.example.com
    acl host_sni req.ssl_sni -m reg ^h-[a-f0-9]{32}\.hosts\.example\.com$
    tcp-request content reject if client_hello !api_sni !relay_sni !host_sni
    tcp-request content accept if client_hello
    use_backend cloud_api if api_sni
    use_backend frp_control if relay_sni
    use_backend host_content if host_sni
backend cloud_api
    server caddy 127.0.0.1:9443 send-proxy-v2
backend frp_control
    server cloud_control_ingress 127.0.0.1:7001
backend host_content
    server cloud_content_ingress 127.0.0.1:7444
