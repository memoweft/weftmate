name: ST-2 phone system bars
on:
  push:
    branches: [wp/st-2-permission-rules]
    paths: [tests/integration/st-2-phone-container.mjs, tests/integration/st-2-system-bars.mjs, .github/workflows/st-2-phone-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        width: [360, 390]
        theme: [light, dark]
    env:
      WEFTMATE_EVIDENCE_DIR: ${{ github.workspace }}/.local/evidence
      WEFTMATE_ST2_PHONE_WIDTH: ${{ matrix.width }}
      WEFTMATE_ST2_PHONE_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: npm ci
      - run: node tests/integration/st-2-phone-container.mjs
      - run: gradle -I ../../.local/st2-phone-container/fixture.gradle -PweftmateApplicationId=com.memoweft.weftmate.mobile.st2qa :app:assembleDebug --no-daemon --console=plain
        working-directory: apps/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 720x1560 -dpi-device 320 -memory 3072 -cores 4
          script: bash .local/st2-phone-container/capture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st-2-phone-system-bars-${{ matrix.width }}-${{ matrix.theme }}
          path: |
            ${{ env.WEFTMATE_EVIDENCE_DIR }}/st-2/phone-system-*.png
            ${{ env.WEFTMATE_EVIDENCE_DIR }}/st-2/system-bar-checks.json
          retention-days: 7
