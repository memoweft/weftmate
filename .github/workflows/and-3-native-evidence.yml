name: AND-3 native Android evidence
on:
  push:
    branches: [wp/and-3-android-shell-catchup]
    paths: ["apps/android/**", "apps/mobile-ui/**", "src/ui-core/**", "tests/integration/and-3-*.mjs", "tests/integration/timeline-ui-candidate.mjs", ".github/workflows/and-3-native-evidence.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: and-3-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: npm ci
      - run: npm ci --prefix services/cloud
      - run: gradle -PweftmateApplicationId=com.memoweft.weftmate.mobile.and3qa :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain --max-workers=2
        working-directory: apps/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 780x1688 -dpi-device 320 -memory 3072 -cores 4
          script: AND3_ADB="$ANDROID_HOME/platform-tools/adb" AND3_SERIAL="$(adb devices | awk '/^emulator-/ {print $1; exit}')" node tests/integration/and-3-android.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: and-3-native-system-bars
          path: |
            tests/evidence/and-3/cloud-*.png
            tests/evidence/and-3/cloud-verification.json
            apps/android/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 7
