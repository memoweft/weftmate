name: Windows packaged application
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Windows package and startup smoke
    strategy:
      fail-fast: false
      matrix:
        memory-runtime: [base, full]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WEFTMATE_TEST_HOST_NAME: synthetic-host
      WEFTMATE_MEMORY_RUNTIME_MODE: ${{ matrix.memory-runtime }}
      WEFTMATE_MEMORY_RUNTIME_DIR: ${{ github.workspace }}/.local/memory-runtime
    steps:
      # Upstream patchedDependencies hashes and carried git patches require LF.
      - name: Preserve source and patch line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read production DSH pin
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('tests/contract/dsh-pin.json')); fs.appendFileSync(process.env.GITHUB_ENV, 'DSH_PIN='+p.commit+'\n');"
      - name: Prepare pinned memory layer and run offline Core RPC
        run: node scripts/memory-runtime/prepare.mjs --mode ${{ matrix.memory-runtime }} --output .local/memory-runtime --cache .local/memory-inputs
      - name: Verify original publisher binary against the Windows runner identity
        if: matrix.memory-runtime == 'full'
        run: node --test tests/integration/memory-runtime-publisher-paths.mjs
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_PIN }}
          path: .local/package-dsh
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Cache patched vendor runtime
        uses: actions/cache@v4
        with:
          path: .local/dsh-cache
          key: vendor-runtime-windows-node24-${{ env.DSH_PIN }}-${{ hashFiles('patches/dsh/*.patch', 'scripts/vendor-dsh.mjs', 'scripts/dsh-runtime-identity.mjs') }}-v1
      - name: Assemble and verify pinned vendor
        run: |
          npm run vendor:dsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run vendor:verify
        env:
          WEFTMATE_DSH_CHECKOUT: ${{ github.workspace }}/.local/package-dsh
      - name: Package policy regression tests
        run: node --test tests/windows-package-policy.test.ts tests/verify-windows-package.test.ts tests/memory-runtime.test.ts
      # Builds NSIS + win-unpacked, verifies archive and loose resources, then
      # drives the real packaged Electron/main/DSH with synthetic local models.
      # No system install registration or published artifact; keys are temporary.
      - name: Build, inspect package contents and start real application
        run: node scripts/nightly/installed-smoke.mjs --out .local/package-smoke
      - name: Record package gate timings
        if: always()
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const f='.local/package-smoke/results.json'; if(fs.existsSync(f)){const r=JSON.parse(fs.readFileSync(f));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, JSON.stringify({passed:r.passed,buildSeconds:r.buildSeconds,durationSeconds:r.durationSeconds,checks:r.checks,identityHits:r.packageCheck?.boundaries.buildMachineIdentityHits},null,2)+'\n');}"
      - name: Upload sanitized smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-smoke-${{ matrix.memory-runtime }}
          path: .local/package-smoke
          retention-days: 7
          if-no-files-found: warn
