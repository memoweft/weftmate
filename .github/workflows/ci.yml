name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs from package-lock.json. get-windows v9 ships N-API
      # prebuilds so no native toolchain is normally needed; if a prebuild is
      # ever missing for a runner, add the platform's build deps here.
      - name: Install dependencies
        run: npm ci

      - name: Release preflight
        run: npm run release:preflight

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
