name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs from package-lock.json. get-windows v9 ships N-API
      # prebuilds so no native toolchain is normally needed; if a prebuild is
      # ever missing for a runner, add the platform's build deps here.
      - name: Install dependencies
        run: npm ci

      - name: Release preflight
        run: npm run release:preflight

      - name: Audit development dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Typecheck
        run: npm run typecheck

      # The synthetic memory HTTP fixture listens on a second loopback host.
      # Linux/Windows accept 127/8; macOS needs the alias explicitly configured.
      - name: Configure macOS fixture loopback
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2

      # CI-1: vendor:dsh consumes an already built external checkout; it does
      # not fetch/build DSH. The pin repo is reachable but has no lib/dist
      # artifacts, and the daily checkout also carries local modifications.
      # Keep these release gates visible as skipped, never claim them verified.
      # Restore them when a reproducible prebuilt pin artifact is available.
      - name: Vendor DSH runtime
        if: ${{ false }}
        run: npm run vendor:dsh

      - name: Verify DSH vendor
        if: ${{ false }}
        run: npm run vendor:verify

      - name: Contract tests (requires prebuilt DSH vendor)
        if: ${{ false }}
        run: npm run test:contract
        env:
          WEFTMATE_DSH_RUNTIME: ${{ github.workspace }}/vendor/dsh-runtime

      - name: Required unit tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum node .github/scripts/ci-unit-tests.mjs required
          else
            node .github/scripts/ci-unit-tests.mjs required
          fi

      # Only the 11 exact baseline case names from PR #20 are non-blocking.
      # Other tests in those files remain in the required step above.
      - name: Known main failures (11 cases; PR 20)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum node .github/scripts/ci-unit-tests.mjs known
          else
            node .github/scripts/ci-unit-tests.mjs known
          fi
