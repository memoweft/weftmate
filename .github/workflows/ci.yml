name: CI

# Private-repo Actions minutes are billed per OS (Linux 1x, Windows 2x,
# macOS 10x). PRs run Linux only; merges to main add Windows (primary desktop
# platform); macOS runs weekly or on demand. Apple apps are built and tested on
# the developer Mac, so macOS here only repeats the Node suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || github.event_name == 'push' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs from package-lock.json. get-windows v9 ships N-API
      # prebuilds so no native toolchain is normally needed; if a prebuild is
      # ever missing for a runner, add the platform's build deps here.
      - name: Install dependencies
        run: npm ci

      # Cloud + host identity integration; isolated services, no Electron or DSH runtime.
      - name: Cloud identity tests (Linux)
        if: runner.os == 'Linux'
        working-directory: services/cloud
        run: node --test test/*.test.mjs

      - name: Release preflight
        run: npm run release:preflight

      - name: Audit development dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Dependency compatibility smoke
        run: node .github/scripts/dependency-smoke.mjs

      - name: Typecheck
        run: npm run typecheck

      # The synthetic memory HTTP fixture listens on a second loopback host.
      # Linux/Windows accept 127/8; macOS needs the alias explicitly configured.
      - name: Configure macOS fixture loopback
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2

      - name: Configure Linux Electron sandbox
        if: runner.os == 'Linux'
        run: |
          # Electron 43 downloads lazily on first require; materialize it
          # before configuring the helper, rather than during a test import.
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # CI-1: vendor:dsh consumes an already built external checkout; it does
      # not fetch/build DSH. The pin repo is reachable but has no lib/dist
      # artifacts, and the daily checkout also carries local modifications.
      # Keep these release gates visible as skipped, never claim them verified.
      # Restore them when a reproducible prebuilt pin artifact is available.
      - name: Vendor DSH runtime
        if: ${{ false }}
        run: npm run vendor:dsh

      - name: Verify DSH vendor
        if: ${{ false }}
        run: npm run vendor:verify

      - name: Contract tests (requires prebuilt DSH vendor)
        if: ${{ false }}
        run: npm run test:contract
        env:
          WEFTMATE_DSH_RUNTIME: ${{ github.workspace }}/vendor/dsh-runtime

      - name: Required unit tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum node .github/scripts/ci-unit-tests.mjs required
          else
            node .github/scripts/ci-unit-tests.mjs required
          fi

      # CI-2 retired 10 baseline exceptions. Only the two product failures
      # reproduced on Linux/macOS remain non-blocking; other cases stay required.
      - name: Known main failures (2 cases; CI-2 reverified)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum node .github/scripts/ci-unit-tests.mjs known
          else
            node .github/scripts/ci-unit-tests.mjs known
          fi

  observed-core:
    name: Observed bridge (real MemoWeft Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WeftMate
        uses: actions/checkout@v4
      - name: Checkout pinned MemoWeft Core (MW-2)
        uses: actions/checkout@v4
        with:
          repository: memoweft/memoweft
          # FX-17 correction-memory candidate; replace after Claude squash.
          ref: 983f53f
          path: memoweft-core
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WeftMate and real Core dependencies
        run: |
          npm ci
          python -m pip install ./memoweft-core/py
          python -c "import sys; print('WEFTMATE_TEST_MEMOWEFT_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"
      - name: Real Core memory lifecycle integration
        run: node --test tests/personal-memory-observed.integration.test.ts tests/personal-memory-observed-outbox.test.ts tests/personal-memory-correction.integration.test.ts tests/personal-memory-freshness.integration.test.ts tests/personal-memory-confirmation.integration.test.ts tests/personal-memory-fx17.integration.test.ts
        env:
          WEFTMATE_TEST_MEMOWEFT_SOURCE: ${{ github.workspace }}/memoweft-core/py/src
