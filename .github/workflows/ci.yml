name: CI

# Windows is a primary product platform: its complete gate must be visible
# before merging. macOS repeats the Node suite weekly or on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.os == 'windows-latest' && 5 || matrix.os == 'macos-latest' && 1 || 3 }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      WEFTMATE_EVIDENCE_DIR: ${{ github.workspace }}/.local/evidence
      WEFTMATE_TEST_HOST_NAME: synthetic-host
      CI_TEST_OS: ${{ matrix.os }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.local/ci-browser-cache
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        shard: [1, 2, 3, 4, 5]
        exclude:
          - os: ubuntu-latest
            shard: 4
          - os: ubuntu-latest
            shard: 5
          - os: macos-latest
            shard: 2
          - os: macos-latest
            shard: 3
          - os: macos-latest
            shard: 4
          - os: macos-latest
            shard: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Required cloud compatibility and mobile request-budget probes read these
      # fixed trees, not their ancestors.
      # Avoid downloading the whole repository before Windows tests can start.
      - name: Fetch fixed legacy fixtures
        run: git fetch --no-tags --depth=1 origin 58589464caec02d651962e57e08a65453c59f6b1 8f1b5de54e15720271e49e9b0653cd06ece3b096

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs from package-lock.json. get-windows v9 ships N-API
      # prebuilds so no native toolchain is normally needed; if a prebuild is
      # ever missing for a runner, add the platform's build deps here.
      - name: Install dependencies
        run: npm ci

      # The first CI-1 probe spent 4–5 minutes before Windows tests started,
      # mostly downloading the same versioned UI binaries on each shard.
      - name: Cache versioned UI test binaries
        uses: actions/cache@v4
        with:
          path: |
            .local/ci-browser-cache
            node_modules/electron/dist
            node_modules/electron/path.txt
          key: ci-ui-binaries-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-v1

      - name: Install Chromium for real UI regression probes
        run: npx playwright install --with-deps chromium

      - name: Materialize versioned Electron binary
        run: node node_modules/electron/install.js

      # Cloud + host identity integration; isolated services, no Electron or DSH runtime.
      - name: Cloud identity tests (Linux)
        if: runner.os == 'Linux' && matrix.shard == 1
        working-directory: services/cloud
        run: node --test test/*.test.mjs

      - name: Release dependency preflight (does not build a package)
        if: matrix.shard == 1
        run: npm run release:preflight

      - name: Public repository hygiene
        if: matrix.shard == 1
        run: |
          node --test tests/public-hygiene.test.mjs tests/evidence-path.test.mjs
          node .github/scripts/public-hygiene.mjs

      - name: Audit development dependencies
        if: matrix.shard == 1
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Dependency compatibility smoke
        if: matrix.shard == 1
        run: node .github/scripts/dependency-smoke.mjs

      - name: Apple callback isolation (CRASH-1)
        if: matrix.shard == 1
        run: node --test tests/apple-callback-isolation.test.mjs

      - name: Typecheck
        if: matrix.shard == 1
        run: npm run typecheck

      - name: Nightly maintenance regressions (no device or task registration)
        if: matrix.shard == 1
        run: node --test tests/nightly-regression.test.mjs

      # The synthetic memory HTTP fixture listens on a second loopback host.
      # Linux/Windows accept 127/8; macOS needs the alias explicitly configured.
      - name: Configure macOS fixture loopback
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2

      - name: Configure Linux Electron sandbox
        if: runner.os == 'Linux'
        run: |
          # Electron 43 downloads lazily on first require; materialize it
          # before configuring the helper, rather than during a test import.
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # The separate pinned-vendor and Windows package jobs build and verify
      # the runtime automatically with carried patches. This ordinary unit job
      # intentionally has no DSH runtime; the full contract gate remains separate.
      - name: Vendor DSH runtime
        if: ${{ false }}
        run: npm run vendor:dsh

      - name: Verify DSH vendor
        if: ${{ false }}
        run: npm run vendor:verify

      - name: Contract tests (requires prebuilt DSH vendor)
        if: ${{ false }}
        run: npm run test:contract
        env:
          WEFTMATE_DSH_RUNTIME: ${{ github.workspace }}/vendor/dsh-runtime

      - name: Required unit tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum node .github/scripts/ci-unit-tests.mjs required --shard ${{ matrix.shard }}/3 --report unit-report.json
          else
            node .github/scripts/ci-unit-tests.mjs required --shard ${{ matrix.shard }}/${{ matrix.os == 'windows-latest' && 5 || matrix.os == 'macos-latest' && 1 || 3 }} --report unit-report.json
          fi

      - name: Upload unit shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-${{ matrix.os }}-${{ matrix.shard }}
          overwrite: true
          path: unit-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload generated unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.shard }}
          overwrite: true
          path: ${{ env.WEFTMATE_EVIDENCE_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      # CI-2 retired 10 baseline exceptions. Only the two product failures
      # reproduced on Linux/macOS remain non-blocking; other cases stay required.
      - name: Known main failures (2 cases; CI-2 reverified)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum node .github/scripts/ci-unit-tests.mjs known
          else
            node .github/scripts/ci-unit-tests.mjs known
          fi

  test-summary:
    name: Required unit tests (summary)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-*
          path: unit-reports
      - name: Total passed, failed, skipped and retry recoveries
        run: node .github/scripts/ci-test-summary.mjs unit-reports
      # needs.test.result can retain the original matrix failure on a partial
      # rerun. Reports are replaced per shard; also verify the latest real job,
      # so a rerun failing before upload cannot reuse an older passing report.
      - name: Require the latest attempt of every shard job to succeed
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { requireLatestShardJobs } = await import(pathToFileURL(process.env.GITHUB_WORKSPACE + '/.github/scripts/ci-test-summary.mjs').href);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.runId, filter: 'all', per_page: 100,
            });
            const latest = requireLatestShardJobs(jobs, { includeMac: !['push', 'pull_request'].includes(context.eventName) });
            core.info(JSON.stringify(latest.map(({ name, run_attempt, conclusion }) => ({ name, run_attempt, conclusion }))));

  observed-core:
    name: Observed bridge (real MemoWeft Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WeftMate
        uses: actions/checkout@v4
      - name: Checkout pinned MemoWeft Core (MW-2)
        uses: actions/checkout@v4
        with:
          repository: memoweft/memoweft
          ref: 05bf798066b57986ab74636860c5450cd7a2b041
          path: memoweft-core
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WeftMate and real Core dependencies
        run: |
          npm ci
          python -m pip install ./memoweft-core/py
          python -c "import sys; print('WEFTMATE_TEST_MEMOWEFT_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"
      - name: Real Core memory lifecycle integration
        run: node --test tests/personal-memory-observed.integration.test.ts tests/personal-memory-observed-outbox.test.ts tests/personal-memory-correction.integration.test.ts tests/personal-memory-freshness.integration.test.ts tests/personal-memory-confirmation.integration.test.ts tests/personal-memory-fx17.integration.test.ts tests/personal-memory-fx18.integration.test.ts tests/personal-memory-actions.integration.test.ts tests/personal-memory-recall-dates.integration.test.ts tests/desktop-memory-core.integration.test.ts tests/personal-memory-core-upgrade.integration.test.ts tests/personal-memory-state-goals.integration.test.ts tests/personal-offline-core.integration.test.ts
        env:
          WEFTMATE_TEST_MEMOWEFT_SOURCE: ${{ github.workspace }}/memoweft-core/py/src
          PYTHONDONTWRITEBYTECODE: '1'
