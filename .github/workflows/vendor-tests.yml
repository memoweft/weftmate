name: Pinned DSH vendor tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: vendor-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vendor:
    name: Pinned DSH vendor unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the fixed legacy migration fixture
        run: git fetch --no-tags --depth=1 origin f787c3c1b1215b969a4db8e143b18da0b2421d5a
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Electron display dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-0
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Read production DSH pin
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('tests/contract/dsh-pin.json')); fs.appendFileSync(process.env.GITHUB_ENV, 'DSH_PIN='+p.commit+'\n');"
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_PIN }}
          path: .local/relay-dsh
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      # vendor:dsh builds the carried patches in an independent LF checkout.
      # Cache only completed runtimes with the commit + patch identity manifest.
      - name: Cache patched vendor runtime
        uses: actions/cache@v4
        with:
          path: .local/dsh-cache
          key: vendor-runtime-linux-node24-${{ env.DSH_PIN }}-${{ hashFiles('patches/dsh/*.patch', 'scripts/vendor-dsh.mjs', 'scripts/dsh-runtime-identity.mjs') }}-v1
      - name: Install Linux launcher compiler
        run: sudo apt-get install -y musl-tools
      - name: Assemble and verify pinned vendor
        run: |
          npm run vendor:dsh
          # The release assembler intentionally ignores install scripts. Linux
          # node-pty has no shipped binary; rebuild this pinned native dependency
          # in the generated runtime before executing the real smoke check.
          npm rebuild --prefix vendor/dsh-runtime node-pty
          npm run vendor:verify
        env:
          WEFTMATE_DSH_CHECKOUT: ${{ github.workspace }}/.local/relay-dsh
      - name: Required pinned vendor suite
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            eval "$(printf "%s" "synthetic-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            xvfb-run --auto-servernum node .github/scripts/ci-unit-tests.mjs vendor --report vendor-test-results.json
          '
      - name: Publish vendor test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-test-results
          path: vendor-test-results.json
          if-no-files-found: warn
      - name: CI-5 five strict config rounds with the pinned vendor
        if: github.head_ref == 'wp/ci-5-flaky-timing'
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5; do
            echo "CI-5 pinned-vendor config round $round of 5"
            dbus-run-session -- bash -euo pipefail -c '
              eval "$(printf "%s" "synthetic-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets)"
              eval "$(gnome-keyring-daemon --start --components=secrets)"
              xvfb-run --auto-servernum node --test tests/bl-29-timing-config.test.ts
            '
            echo "Pinned vendor config round $round passed" >> "$GITHUB_STEP_SUMMARY"
          done
