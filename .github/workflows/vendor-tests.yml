name: Pinned DSH vendor tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: vendor-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vendor:
    name: Pinned DSH vendor unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the fixed legacy migration fixture
        run: git fetch --no-tags --depth=1 origin f787c3c1b1215b969a4db8e143b18da0b2421d5a
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Electron display dependencies
        run: |
          npx playwright install-deps chromium
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Read production DSH pin
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('tests/contract/dsh-pin.json')); fs.appendFileSync(process.env.GITHUB_ENV, 'DSH_PIN='+p.commit+'\n');"
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_PIN }}
          path: .local/relay-dsh
          persist-credentials: false
      # The shipped runtime is the pinned source plus WeftMate's carried patches
      # (patches/dsh). Building without them does not reproduce the product.
      - name: Apply carried DSH patches
        working-directory: .local/relay-dsh
        run: |
          for patch in "$GITHUB_WORKSPACE"/patches/dsh/*.patch; do
            echo "applying $(basename "$patch")"
            git apply --whitespace=nowarn "$patch"
          done
          git status --short | head -20
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Cache pinned DSH compilation
        id: dsh-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .local/relay-dsh/node_modules
            .local/relay-dsh/packages/*/*/lib
            .local/relay-dsh/vendor/*/lib
            .local/relay-dsh/apps/*/lib
            .local/relay-dsh/apps/web/dist
            .local/relay-dsh/native/landlock-run/lib
            .local/relay-dsh/native/landlock-run/packages/*/lib
          key: vendor-dsh-patched-linux-node24-${{ env.DSH_PIN }}-${{ hashFiles('patches/dsh/*.patch') }}-v1
      - name: Link pinned DSH workspace dependencies
        working-directory: .local/relay-dsh
        run: pnpm install --frozen-lockfile
      - name: Build pinned native tools (no model keys)
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        working-directory: .local/relay-dsh
        run: pnpm run build
      - name: Save compiled fixture before scenario assertions
        timeout-minutes: 2
        continue-on-error: true
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .local/relay-dsh/node_modules
            .local/relay-dsh/packages/*/*/lib
            .local/relay-dsh/vendor/*/lib
            .local/relay-dsh/apps/*/lib
            .local/relay-dsh/apps/web/dist
            .local/relay-dsh/native/landlock-run/lib
            .local/relay-dsh/native/landlock-run/packages/*/lib
          key: vendor-dsh-patched-linux-node24-${{ env.DSH_PIN }}-${{ hashFiles('patches/dsh/*.patch') }}-v1
      # Relay executes directly from the workspace and its cache omits native
      # binaries. Shipping the closure also packs the Linux launcher, whose
      # upstream prepack requires a real native build.
      - name: Cache pinned Linux launcher
        id: native-cache
        uses: actions/cache@v4
        with:
          path: .local/relay-dsh/native/landlock-run/packages/*/bin
          key: vendor-dsh-native-linux-x64-${{ env.DSH_PIN }}-v1
      - name: Build pinned Linux launcher
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: .local/relay-dsh/native/landlock-run
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          pnpm run build:native
      - name: Assemble and verify pinned vendor
        run: |
          npm run vendor:dsh
          # The release assembler intentionally ignores install scripts. Linux
          # node-pty has no shipped binary; rebuild this pinned native dependency
          # in the generated runtime before executing the real smoke check.
          npm rebuild --prefix vendor/dsh-runtime node-pty
          npm run vendor:verify
        env:
          WEFTMATE_DSH_CHECKOUT: ${{ github.workspace }}/.local/relay-dsh
      - name: Required pinned vendor suite
        run: xvfb-run --auto-servernum node .github/scripts/ci-unit-tests.mjs vendor --report vendor-test-results.json
      - name: Publish vendor test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-test-results
          path: vendor-test-results.json
          if-no-files-found: warn
