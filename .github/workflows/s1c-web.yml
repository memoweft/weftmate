name: S1c Web and Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: s1c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android debug and JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - working-directory: apps/android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Publish JVM results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1c-android-jvm
          path: apps/android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
  browser:
    name: Web cloud login interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/mobile-ui
      - run: npx --prefix apps/mobile-ui playwright install --with-deps chromium
      - run: node --test tests/personal-cloud-web.test.ts apps/mobile-ui/tests/cloud-login.test.mjs apps/mobile-ui/tests/chat-interactions.test.mjs
      - run: node --test services/cloud/test/web-login.test.mjs
        env:
          WEFTMATE_WEB_E2E: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1c-web-synthetic
          path: .local/s1c-web/*.png
          if-no-files-found: ignore
