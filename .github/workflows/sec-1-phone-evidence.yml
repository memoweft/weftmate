name: SEC-1 phone system bars
on:
  push:
    branches: [wp/sec-1-second-opinion]
    paths: [tests/integration/sec-1-phone-evidence.mjs, tests/integration/sec-1-system-bars.mjs, .github/workflows/sec-1-phone-evidence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        width: [360, 390]
        theme: [light, dark]
    env:
      WEFTMATE_SEC1_PHONE_WIDTH: ${{ matrix.width }}
      WEFTMATE_SEC1_PHONE_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: npm ci
      - run: npm ci --prefix services/cloud
      - run: node tests/integration/st-2-phone-container.mjs
      - run: gradle -I ../../.local/st2-phone-container/fixture.gradle -PweftmateApplicationId=com.memoweft.weftmate.mobile.sec1qa :app:assembleDebug --no-daemon --console=plain
        working-directory: apps/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 720x1560 -dpi-device 320 -memory 3072 -cores 4
          script: >-
            WEFTMATE_SEC1_ADB="$ANDROID_HOME/platform-tools/adb"
            WEFTMATE_SEC1_ANDROID_SERIAL="$(adb devices | awk '/^emulator-/ {print $1; exit}')"
            WEFTMATE_SEC1_ANDROID_PACKAGE=com.memoweft.weftmate.mobile.sec1qa
            WEFTMATE_SEC1_ANDROID_ACTIVITY=com.memoweft.weftmate.mobile.St2PhoneBrowserActivity
            WEFTMATE_SEC1_ANDROID_APK="$PWD/apps/android/app/build/outputs/apk/debug/app-debug.apk"
            WEFTMATE_SEC1_AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
            node tests/integration/sec-1-phone-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-1-phone-system-bars-${{ matrix.width }}-${{ matrix.theme }}
          path: |
            tests/evidence/sec-1/phone-system-*.png
            tests/evidence/sec-1/system-bar-checks.json
          retention-days: 7
