name: CI-5 five strict timing rounds
on:
  pull_request:
    branches: [main]
jobs:
  proof:
    if: github.head_ref == 'wp/ci-5-flaky-timing'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    env:
      WEFTMATE_EVIDENCE_DIR: ${{ github.workspace }}/.local/evidence/ci-5
      WEFTMATE_TEST_HOST_NAME: synthetic-host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch the same fixed legacy fixtures as required CI
        run: git fetch --no-tags --depth=1 origin 58589464caec02d651962e57e08a65453c59f6b1 8f1b5de54e15720271e49e9b0653cd06ece3b096
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node node_modules/electron/install.js
      - name: Configure Linux Electron
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Five consecutive whole-file rounds without retries
        shell: bash
        run: |
          node .github/scripts/ci-5-repeat.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-5-five-rounds-${{ matrix.os }}
          path: .local/evidence/ci-5
          retention-days: 7
