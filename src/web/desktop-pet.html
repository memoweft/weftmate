<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WeftMate 桌面宠物</title>
  <style>
    :root { color-scheme: dark; --primary: #c46f8b; --accent: #f1b3c5; --look-x: 0px; --look-y: 0px; font-family: "Microsoft YaHei UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; user-select: none; }
    body { display: grid; place-items: center; padding: 5px; }
    #stage { -webkit-app-region: no-drag; width: 100%; height: 100%; display: grid; place-items: center; cursor: default; touch-action: none; }
    #petWrap { position: relative; width: 104px; height: 104px; display: grid; place-items: center; filter: drop-shadow(0 14px 12px rgba(0,0,0,.34)); transform-origin: 50% 90%; animation: breathe 4.6s ease-in-out infinite; }
    body[data-presence="companion"] #petWrap { animation: companion 3.4s ease-in-out infinite; }
    body[data-presence="quiet"] #petWrap { animation-duration: 7s; }
    body[data-activity="running"] #petWrap { animation: companion 1.7s ease-in-out infinite; }
    body[data-activity="waiting"] #petWrap { animation: waiting 1.8s ease-in-out infinite; }
    body[data-activity="failed"] #petWrap { animation: failed .48s ease-out 2; }
    body[data-sensing="idle"] #petWrap, body[data-sensing="locked"] #petWrap { animation: rest 7s ease-in-out infinite; filter: grayscale(.28) drop-shadow(0 10px 9px rgba(0,0,0,.26)); }
    body[data-sensing="idle"] #face::before, body[data-sensing="idle"] #face::after,
    body[data-sensing="locked"] #face::before, body[data-sensing="locked"] #face::after { height: 2px; top: 4px; animation: none; }
    #petWrap:hover { transform: translateY(-3px) scale(1.06); }
    #petWrap.poke { animation: poke .42s ease-out !important; }
    #glow { position: absolute; inset: 15px; border-radius: 50%; background: color-mix(in srgb, var(--primary) 25%, transparent); filter: blur(13px); }
    #body { position: relative; z-index: 1; width: 62px; height: 62px; background: var(--primary); box-shadow: inset 0 5px 8px rgba(255,255,255,.14), 0 0 16px color-mix(in srgb, var(--primary) 50%, transparent); }
    body[data-shape="orbit"] #body { border: 8px solid var(--primary); border-radius: 50%; background: transparent; }
    body[data-shape="orbit"] #body::after { content: ""; position: absolute; inset: 13px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px var(--accent); }
    body[data-shape="sprout"] #body { height: 53px; margin-top: 14px; border-radius: 52% 52% 45% 45%; }
    body[data-shape="sprout"] #body::before { content: ""; position: absolute; left: 28px; top: -17px; width: 28px; height: 19px; border-radius: 90% 10% 90% 10%; background: var(--accent); transform: rotate(-18deg); }
    body[data-shape="wisp"] #body { border-radius: 56% 56% 48% 48%; transform: rotate(45deg); }
    body[data-shape="wisp"] #body::after { content: ""; position: absolute; width: 23px; height: 23px; right: -8px; bottom: -8px; border-radius: 50%; background: transparent; box-shadow: -9px -9px 0 rgba(0,0,0,.18); }
    #face { position: absolute; z-index: 3; left: 50%; top: 53%; width: 30px; height: 10px; transform: translate(calc(-50% + var(--look-x)),calc(-50% + var(--look-y))); transition: transform 90ms linear; }
    #face::before, #face::after { content: ""; position: absolute; top: 0; width: 5px; height: 7px; border-radius: 50%; background: #15151b; animation: blink 5.2s infinite; }
    #face::before { left: 2px; } #face::after { right: 2px; }
    #feature { position: absolute; z-index: 2; pointer-events: none; }
    body[data-feature="thread"] #feature { width: 69px; height: 22px; border-top: 4px solid var(--accent); border-bottom: 4px solid var(--accent); border-radius: 50%; transform: rotate(-24deg); }
    body[data-feature="leaf"] #feature { right: 14px; top: 11px; width: 22px; height: 31px; border-radius: 90% 10% 90% 10%; background: var(--accent); transform: rotate(25deg); }
    body[data-feature="halo"] #feature { top: 9px; width: 65px; height: 18px; border: 4px solid var(--accent); border-radius: 50%; }
    body[data-feature="ears"] #feature { top: 14px; width: 61px; height: 25px; border-left: 18px solid var(--accent); border-right: 18px solid var(--accent); border-radius: 44%; }
    #activity { position: absolute; z-index: 6; top: 4px; left: 50%; transform: translateX(-50%); padding: 3px 7px; border-radius: 999px; background: rgba(21,23,30,.88); color: #dfe8f5; font-size: 9px; opacity: 0; transition: opacity .16s; white-space: nowrap; }
    body:not([data-activity="idle"]) #activity { opacity: 1; }
    body[data-activity="waiting"] #activity { color: #ffd99a; }
    body[data-activity="failed"] #activity { color: #ffaaa8; }
    body[data-behavior="notice"] #petWrap { filter: brightness(1.08) drop-shadow(0 14px 14px rgba(0,0,0,.36)); }
    body[data-behavior="wander"] #petWrap, body[data-behavior="dock"] #petWrap { animation: travel .34s ease-in-out infinite; }
    body[data-behavior="avoid"] #petWrap { animation: scurry .22s ease-in-out infinite alternate; }
    @keyframes breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.025); } }
    @keyframes companion { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
    @keyframes waiting { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(.96); } }
    @keyframes failed { 0%,100% { transform: translateX(0); } 35% { transform: translateX(-5px); } 70% { transform: translateX(5px); } }
    @keyframes poke { 0%,100% { transform: scale(1); } 35% { transform: translateY(-12px) scale(1.08,.94); } 65% { transform: translateY(2px) scale(.96,1.06); } }
    @keyframes rest { 0%,100% { transform: translateY(2px) scale(1); } 50% { transform: translateY(4px) scale(1.02,.98); } }
    @keyframes notice { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-5px) rotate(3deg); } }
    @keyframes travel { 0%,100% { transform: translateY(1px) rotate(-3deg) scale(1); } 50% { transform: translateY(-8px) rotate(3deg) scale(1.04,.96); } }
    @keyframes scurry { from { transform: translateY(1px) rotate(-5deg) scale(1.02,.98); } to { transform: translateY(-5px) rotate(5deg) scale(.98,1.02); } }
    @keyframes blink { 0%,45%,48%,100% { transform: scaleY(1); } 46%,47% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { #petWrap, #face::before, #face::after { animation: none !important; } }
  </style>
</head>
<body data-shape="orbit" data-feature="thread" data-presence="light" data-activity="idle" data-sensing="off" data-behavior="idle">
  <div id="stage" title="拖动我换位置">
    <div id="petWrap"><div id="activity"></div><div id="glow"></div><div id="feature"></div><div id="body"></div><div id="face"></div></div>
  </div>
  <script>
    const petWrap = document.getElementById('petWrap');
    const activity = document.getElementById('activity');
    const activityText = { running: '正在处理', waiting: '等你确认', review: '已经完成', failed: '出了点问题' };
    window.wmDesktopPet?.onState((state) => {
      const appearance = state?.pet?.appearance || {};
      document.body.dataset.shape = appearance.shape || 'orbit';
      document.body.dataset.feature = appearance.feature || 'thread';
      document.body.dataset.presence = state?.proactivity || 'light';
      document.body.dataset.activity = state?.activity || 'idle';
      document.body.dataset.sensing = state?.presence?.state || 'off';
      document.documentElement.style.setProperty('--primary', appearance.primary || '#c46f8b');
      document.documentElement.style.setProperty('--accent', appearance.accent || '#f1b3c5');
      activity.textContent = activityText[state?.activity] || '';
      document.title = `${state?.pet?.name || state?.persona?.name || 'WeftMate'} · WeftMate`;
    });
    window.wmDesktopPet?.onBehavior((state) => {
      const allowed = ['idle', 'watch', 'notice', 'wander', 'avoid', 'dock', 'rest'];
      document.body.dataset.behavior = allowed.includes(state?.kind) ? state.kind : 'idle';
      const lookX = Math.max(-1, Math.min(1, Number(state?.lookX) || 0));
      const lookY = Math.max(-1, Math.min(1, Number(state?.lookY) || 0));
      document.documentElement.style.setProperty('--look-x', `${(lookX * 4).toFixed(1)}px`);
      document.documentElement.style.setProperty('--look-y', `${(lookY * 2.5).toFixed(1)}px`);
    });
    document.addEventListener('mouseenter', () => window.wmDesktopPet?.setPointerInside(true));
    document.addEventListener('mouseleave', () => window.wmDesktopPet?.setPointerInside(false));
    document.addEventListener('contextmenu', (event) => { event.preventDefault(); window.wmDesktopPet?.openContextMenu(); });
    const stage = document.getElementById('stage');
    let drag = null;
    let suppressClick = false;
    stage.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      window.wmDesktopPet?.interact('click');
      drag = { pointerId: event.pointerId, x: event.screenX, y: event.screenY, started: false };
      stage.setPointerCapture?.(event.pointerId);
    });
    stage.addEventListener('pointermove', (event) => {
      if (!drag || drag.pointerId !== event.pointerId) return;
      if (!drag.started && Math.hypot(event.screenX - drag.x, event.screenY - drag.y) < 4) return;
      if (!drag.started) {
        drag.started = true;
        window.wmDesktopPet?.dragStart({ x: drag.x, y: drag.y });
      }
      window.wmDesktopPet?.dragMove({ x: event.screenX, y: event.screenY });
    });
    const finishDrag = (event) => {
      if (!drag || (event?.pointerId !== undefined && drag.pointerId !== event.pointerId)) return;
      if (drag.started) {
        suppressClick = true;
        window.wmDesktopPet?.dragEnd();
        setTimeout(() => { suppressClick = false; }, 0);
      }
      drag = null;
    };
    stage.addEventListener('pointerup', finishDrag);
    stage.addEventListener('pointercancel', finishDrag);
    petWrap.addEventListener('click', () => {
      if (suppressClick) return;
      window.wmDesktopPet?.interact('click');
      petWrap.classList.remove('poke'); void petWrap.offsetWidth; petWrap.classList.add('poke');
      setTimeout(() => petWrap.classList.remove('poke'), 450);
    });
    petWrap.addEventListener('dblclick', () => { window.wmDesktopPet?.interact('doubleclick'); window.wmDesktopPet?.openPage(); });
  </script>
</body>
</html>
